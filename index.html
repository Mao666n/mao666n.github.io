    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .container {
            text-align: center;
            z-index: 10;
            padding: 20px;
            background-color: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(5px);
            max-width: 90%;
        }

        h1 {
            font-size: 3.5rem;
            margin-bottom: 40px;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.5);
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
        }

        .btn {
            display: inline-block;
            padding: 15px 30px;
            background-color: #3498db;
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            border: none;
            cursor: pointer;
            width: 220px;
            text-align: center;
        }

        .btn:hover {
            background-color: #2980b9;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }

        .btn:active {
            transform: translateY(1px);
        }

        .snowflake {
            position: absolute;
            top: -10px;
            color: white;
            font-size: 1.5rem;
            user-select: none;
            z-index: 1;
            opacity: 0.8;
        }

        @keyframes fall {
            0% {
                transform: translateY(-10px) rotate(0deg);
                opacity: 0.8;
            }
            100% {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 2.5rem;
            }
            .btn {
                width: 200px;
                padding: 12px 25px;
            }
        }
    </style>
</head>

    <script>
        function createSnowflakes() {
            const snowflakeContainer = document.body;
            const snowflakeCount = 50;

            for (let i = 0; i < snowflakeCount; i++) {
                const snowflake = document.createElement('div');
                snowflake.className = 'snowflake';
                snowflake.innerHTML = '😋';

                const startPositionX = Math.random() * window.innerWidth;
                const startPositionY = Math.random() * window.innerHeight;
                const size = Math.random() * 1.5 + 0.5;
                const animationDelay = Math.random() * 5;
                const animationDuration = Math.random() * 10 + 10;

                snowflake.style.left = `${startPositionX}px`;
                snowflake.style.top = `${startPositionY}px`;
                snowflake.style.fontSize = `${size}rem`;
                snowflake.style.animation = `fall ${animationDuration}s linear ${animationDelay}s infinite`;

                snowflakeContainer.appendChild(snowflake);
            }
        }

        window.addEventListener('load', createSnowflakes);
        window.addEventListener('resize', function() {
            document.querySelectorAll('.snowflake').forEach(snowflake => {
                snowflake.remove();
            });
            createSnowflakes();
        });
    </script>
