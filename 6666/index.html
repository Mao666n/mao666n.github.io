        .link-note {

        }

        footer {

<script>
    // 下雪效果
    const snow = document.getElementById('snow');
    const snowBtn = document.getElementById('snowBtn');
    let snowing = false;
    let snowflakes = [];

    // 创建雪花
    function createSnow() {
        snow.innerHTML = '';
        snowflakes = [];
        
        const count = Math.min(80, Math.floor(window.innerWidth * window.innerHeight / 10000));
        
        for (let i = 0; i < count; i++) {
            const flake = document.createElement('div');
            flake.className = 'snowflake';
            flake.innerHTML = '😋';
            flake.style.left = Math.random() * 100 + '%';
            flake.style.fontSize = (Math.random() * 10 + 15) + 'px';
            flake.style.opacity = Math.random() * 0.7 + 0.3;
            
            snow.appendChild(flake);
            
            snowflakes.push({
                el: flake,
                x: parseFloat(flake.style.left),
                y: Math.random() * -100,
                speed: Math.random() * 2 + 1,
                sway: Math.random() * 2 - 1
            });
        }
    }

    // 动画雪花
    function animateSnow() {
        const height = window.innerHeight;
        
        snowflakes.forEach(flake => {
            flake.y += flake.speed;
            flake.x += Math.sin(flake.y * 0.01) * flake.sway;
            
            if (flake.y > height) {
                flake.y = -20;
                flake.x = Math.random() * 100;
            }
            
            flake.el.style.left = flake.x + '%';
            flake.el.style.top = flake.y + 'px';
        });
        
        if (snowing) {
            requestAnimationFrame(animateSnow);
        }
    }

    // 切换下雪
    function toggleSnow() {
        snowing = !snowing;
        
        if (snowing) {
            snow.style.opacity = '1';
            snowBtn.innerHTML = '❄️ 关闭下雪';
            snowBtn.style.background = '#e63946';
            snowBtn.style.color = 'white';
            createSnow();
            animateSnow();
        } else {
            snow.style.opacity = '0';
            snowBtn.innerHTML = '❄️ 开启下雪';
            snowBtn.style.background = 'rgba(255, 255, 255, 0.9)';
            snowBtn.style.color = '#333';
        }
    }

    // 初始化
    snowBtn.addEventListener('click', toggleSnow);
    
    // 窗口大小变化时重新创建雪花
    window.addEventListener('resize', () => {
        if (snowing) {
            createSnow();
        }
    });

    // 页面加载动画
    document.addEventListener('DOMContentLoaded', () => {
        const cards = document.querySelectorAll('.card');
        cards.forEach((card, i) => {
            card.style.opacity = '0';
            card.style.transform = 'translateY(20px)';
            setTimeout(() => {
                card.style.transition = 'all 0.5s ease';
                card.style.opacity = '1';
                card.style.transform = 'translateY(0)';
            }, i * 100);
        });
    });
</script>
