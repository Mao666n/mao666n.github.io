        :root {

            --text-main: #1d1d1f;

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            padding: 50px;
            background-image: radial-gradient(circle at 50% 0%, #e8e8ed 0%, #f5f5f7 100%);
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        /* Header Area */
        header {
            text-align: center;
            padding: 60px 0 40px;
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 600;
            letter-spacing: -0.015em;
            margin-bottom: 10px;
        }

        .slogan {
            color: var(--primary-color);
            font-weight: 500;
            font-size: 1.1rem;
            margin-bottom: 20px;
        }

        /* Card Style */
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 24px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-2px);
        }

        h2 {
            font-size: 1.5rem;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
        }

        h2::before {
            content: "";
            width: 4px;
            height: 20px;
            background: var(--primary-color);
            margin-right: 12px;
            border-radius: 2px;
        }

        .description {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-bottom: 20px;
        }

        /* Links/Buttons */
        .link-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
        }

        .download-link {
            display: flex;
            flex-direction: column;
            padding: 15px;
            background: #fff;
            border-radius: 12px;
            text-decoration: none;
            color: var(--text-main);
            border: 1px solid #e5e5e7;
            transition: all 0.2s;
        }

        .download-link:hover {
            border-color: var(--primary-color);
            background: #fafafa;
        }

        .link-title {
            font-weight: 600;
            color: var(--primary-color);
            margin-bottom: 4px;
        }

        .link-note {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .password-tag {
            display: inline-block;
            font-size: 0.75rem;
            background: #f2f2f7;
            padding: 2px 8px;
            border-radius: 4px;
            margin-top: 8px;
            width: fit-content;
        }

        /* Info Section */
        .info-bar {
            font-size: 0.9rem;
            background: rgba(0, 113, 227, 0.05);
            border-left: 4px solid var(--primary-color);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 25px;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 40px 0;
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        .contact-list {
            margin-bottom: 10px;
        }

        .contact-list span {
            margin: 0 10px;
        }

        /* Responsive */
        @media (max-width: 600px) {
            header h1 { font-size: 2rem; }
            .card { padding: 20px; }
        }
    </style>
</head>
